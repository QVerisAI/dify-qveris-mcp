[project]
name = "dify-qveris-mcp"
version = "0.1.0"
description = "QVeris MCP Gateway extension for Dify"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "dify_plugin>=0.10.2,<0.11.0",
  "requests>=2.32.5,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2,<9.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["endpoints"]
py-modules = ["main"]
