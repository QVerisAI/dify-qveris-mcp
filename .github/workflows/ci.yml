name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Confirm the Marketplace README is English-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("README.md").read_text(encoding="utf-8")
          assert not re.search(r"[\u3400-\u9fff]", text), "README.md contains CJK text"
          PY
